name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-checks:
    name: Проверки репозитория
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks смотрит всю историю

      - name: Поиск секретов (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner

      - name: JSON-файлы моков валидны
        run: find mocks -name '*.json' -print0 | xargs -0 -n1 jq empty

      - name: Скрипты в git с правом исполнения (100755)
        run: |
          bad=$(git ls-files -s '*.sh' | grep -v '^100755' || true)
          if [ -n "$bad" ]; then
            echo "Нет бита исполнения, добавляй через git add --chmod=+x:"
            echo "$bad"
            exit 1
          fi

      - name: Compose-файл собирается (базовый и с добавками)
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose.yaml config -q
          docker compose --env-file .env -f infra/compose.yaml -f infra/compose.mocks-ports.yaml config -q
          docker compose --env-file .env -f infra/compose.yaml -f infra/compose.app-ports.yaml config -q
          docker compose --env-file .env -f infra/compose.yaml -f infra/compose.demo.yaml config -q

  ui:
    name: Тесты ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Форматирование (Prettier)
        run: npm run format:check

      - name: Unit-тесты (Vitest)
        run: npm test

  e2e:
    name: Тесты tests/e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Форматирование (Prettier)
        run: npm run format:check

      - name: Фикстуры (без стенда)
        run: npm run test:fixtures

      - name: Поднять моки
        working-directory: .
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose.yaml -f infra/compose.mocks-ports.yaml \
            up -d --wait mock-crm mock-billing mock-registry

      - name: Контрактные тесты моков
        run: npm run test:mocks

      - name: Логи моков при падении
        if: failure()
        working-directory: .
        run: docker compose --env-file .env -f infra/compose.yaml -f infra/compose.mocks-ports.yaml logs --no-color

      - name: Отчёт Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
