openapi: 3.0.3
info:
  title: B2B Order Flow External API
  version: 0.1.0
  description: Public UI-facing contract. Business rules and authorization are enforced by core-service.
servers:
  - url: /
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses: {'200': {description: Successful login}, '401': { $ref: '#/components/responses/Problem'}}
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'201': {description: Registered}, '400': { $ref: '#/components/responses/Problem'}}
  /api/v1/me:
    get:
      operationId: getMe
      security: [{bearerAuth: []}]
      responses: {'200': {description: Current user}}
  /api/v1/companies:
    post:
      operationId: registerCompany
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses: {'201': {description: Company registered}, '400': { $ref: '#/components/responses/Problem'}}
  /api/v1/companies/{companyId}:
    get:
      operationId: getCompany
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/CompanyId'}]
      responses: {'200': {description: Company}, '404': { $ref: '#/components/responses/Problem'}}
  /api/v1/admin/companies:
    get:
      operationId: listPendingCompanies
      security: [{bearerAuth: []}]
      responses: {'200': {description: Pending companies}}
  /api/v1/admin/companies/{companyId}/confirm:
    post:
      operationId: confirmCompany
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/CompanyId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'200': {description: Confirmed}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/admin/companies/{companyId}/reject:
    post:
      operationId: rejectCompany
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/CompanyId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'200': {description: Rejected}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests:
    get:
      operationId: listRequests
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/CorrelationId'}, { $ref: '#/components/parameters/ActiveRole'}, { $ref: '#/components/parameters/Page'}, { $ref: '#/components/parameters/Size'}, { $ref: '#/components/parameters/Sort'}]
      responses: {'200': {description: Request list}}
    post:
      operationId: createRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/CorrelationId'}, { $ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses: {'201': {description: Draft created}, '422': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}:
    get:
      operationId: getRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      responses: {'200': {description: Request card}, '404': { $ref: '#/components/responses/Problem'}}
    patch:
      operationId: updateRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'200': {description: Updated}, '409': { $ref: '#/components/responses/Problem'}}
    delete:
      operationId: deleteRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      responses: {'204': {description: Deleted}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}/submit:
    post:
      operationId: submitRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Submitted}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}/claim:
    post:
      operationId: claimRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}, { $ref: '#/components/parameters/ActiveRole'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Claimed}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}/assign-manager:
    post:
      operationId: assignManager
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}, { $ref: '#/components/parameters/ActiveRole'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignManagerCommand'}}}}
      responses: {'200': {description: Manager assigned}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}/recheck-data:
    post:
      operationId: recheckData
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Rechecked}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}/history:
    get:
      operationId: getRequestHistory
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      responses: {'200': {description: Request history}}
  /api/v1/requests/{requestId}/commercial-terms:
    post:
      operationId: commercialTerms
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommercialTermsCommand'}}}}
      responses: {'200': {description: Commercial terms saved}}
  /api/v1/requests/{requestId}/contract/sent:
    post:
      operationId: contractSent
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Contract sent}}
  /api/v1/requests/{requestId}/contract/concluded:
    post:
      operationId: contractConcluded
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ContractConcludedCommand'}}}}
      responses: {'200': {description: Contract concluded}}
  /api/v1/requests/{requestId}/contract/accept-offer:
    post:
      operationId: acceptOffer
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Offer accepted}}
  /api/v1/requests/{requestId}/act/sent:
    post:
      operationId: actSent
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Act sent}}
  /api/v1/requests/{requestId}/act/signed:
    post:
      operationId: actSigned
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Act signed}}
  /api/v1/requests/{requestId}/close-by-default:
    post:
      operationId: closeByDefault
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Request closed}}
  /api/v1/stages:
    get:
      operationId: listStages
      security: [{bearerAuth: []}]
      responses: {'200': {description: Stage queue}}
  /api/v1/stages/my:
    get:
      operationId: myStages
      security: [{bearerAuth: []}]
      responses: {'200': {description: Current user's stages}}
  /api/v1/stages/{stageId}/claim:
    post:
      operationId: claimStage
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/StageId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Stage claimed}}
  /api/v1/stages/{stageId}/assign:
    post:
      operationId: assignStage
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/StageId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignStageCommand'}}}}
      responses: {'200': {description: Stage assigned}}
  /api/v1/stages/{stageId}/tech-result:
    post:
      operationId: techResult
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/StageId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TechResultCommand'}}}}
      responses: {'200': {description: Technical result saved}}
  /api/v1/stages/{stageId}/complete:
    post:
      operationId: completeStage
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/StageId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Stage completed}}
  /api/v1/stages/{stageId}/activate:
    post:
      operationId: activateStage
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/StageId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Service activated}}
  /api/v1/requests/{requestId}/sla:
    get:
      operationId: requestSla
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      responses: {'200': {description: SLA information}}
  /api/v1/stages/{stageId}/sla/pause:
    post:
      operationId: pauseSla
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/StageId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PauseCommand'}}}}
      responses: {'200': {description: SLA paused}}
  /api/v1/stages/{stageId}/sla/resume:
    post:
      operationId: resumeSla
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/StageId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: SLA resumed}}
  /api/v1/stages/{stageId}/sla/extend-pause:
    post:
      operationId: extendSlaPause
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/StageId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SlaExtendPauseCommand'}}}}
      responses: {'200': {description: SLA pause extended}}
  /api/v1/notifications:
    get:
      operationId: listNotifications
      security: [{bearerAuth: []}]
      responses: {'200': {description: Notifications}}
  /api/v1/notifications/{notificationId}/read:
    post:
      operationId: readNotification
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/NotificationId'}]
      responses: {'204': {description: Notification read}}
  /api/v1/notifications/read-all:
    post:
      operationId: readAllNotifications
      security: [{bearerAuth: []}]
      responses: {'204': {description: Notifications read}}
  /api/v1/users:
    get:
      operationId: listUsers
      security: [{bearerAuth: []}]
      parameters:
        - name: role
          in: query
          required: true
          schema: {type: string}
      responses: {'200': {description: Users}}
  /api/v1/ws/ticket:
    get:
      operationId: issueWebsocketTicket
      security: [{bearerAuth: []}]
      responses: {'200': {description: WebSocket ticket}}
  /api/v1/requests/{requestId}/data:
    parameters: [{ $ref: '#/components/parameters/RequestId'}]
    patch:
      operationId: updateRequestData
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateRequestDataCommand'}}}}
      responses: {'200': {description: Updated request data}}
  /api/v1/requests/{requestId}/resubmit:
    parameters: [{ $ref: '#/components/parameters/RequestId'}]
    post:
      operationId: resubmitRequest
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Resubmitted}}
  /api/v1/requests/{requestId}/revisions:
    parameters: [{ $ref: '#/components/parameters/RequestId'}]
    get:
      operationId: requestRevisions
      security: [{bearerAuth: []}]
      parameters:
        - { $ref: '#/components/parameters/Page'}
        - { $ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Request revisions
          content: {application/json: {schema: {$ref: '#/components/schemas/RequestRevisionPage'}}}
  /api/v1/requests/{requestId}/route:
    parameters: [{ $ref: '#/components/parameters/RequestId'}]
    get:
      operationId: requestRoute
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Request route
          content: {application/json: {schema: {$ref: '#/components/schemas/RouteView'}}}
  /api/v1/stages/{stageId}/decision:
    parameters: [{ $ref: '#/components/parameters/StageId'}]
    post:
      operationId: decideStage
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'200': {description: Stage decision}}
  /api/v1/stages/{stageId}/return:
    parameters: [{ $ref: '#/components/parameters/StageId'}]
    post:
      operationId: returnStage
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'200': {description: Stage returned}}
  /api/v1/stages/{stageId}/problem:
    parameters: [{ $ref: '#/components/parameters/StageId'}]
    post:
      operationId: stageProblem
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageProblemCommand'}}}}
      responses: {'200': {description: Stage problem}}
  /api/v1/requests/{requestId}/contract/change-request:
    parameters: [{ $ref: '#/components/parameters/RequestId'}]
    post:
      operationId: contractChangeRequest
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'200': {description: Contract change requested}}
  /api/v1/requests/{requestId}/defect-claim:
    parameters: [{ $ref: '#/components/parameters/RequestId'}]
    post:
      operationId: defectClaim
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DefectClaimCommand'}}}}
      responses: {'200': {description: Defect claim}}
  /api/v1/requests/{requestId}/cancel:
    parameters: [{ $ref: '#/components/parameters/RequestId'}]
    post:
      operationId: cancelRequest
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'200': {description: Request cancelled}}
  /api/v1/requests/{requestId}/cancellation-requests:
    parameters: [{ $ref: '#/components/parameters/RequestId'}]
    get:
      operationId: listCancellationRequests
      security: [{bearerAuth: []}]
      parameters:
        - { $ref: '#/components/parameters/Page'}
        - { $ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Cancellation requests
          content: {application/json: {schema: {$ref: '#/components/schemas/CancellationRequestPage'}}}
    post:
      operationId: createCancellationRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CancellationRequestCommand'}}}}
      responses: {'201': {description: Cancellation request created}}
  /api/v1/cancellation-requests/{cancellationId}/costs:
    parameters: [{ $ref: '#/components/parameters/CancellationId'}]
    post:
      operationId: setCancellationCosts
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CancellationCostsCommand'}}}}
      responses: {'200': {description: Costs set}}
  /api/v1/cancellation-requests/{cancellationId}/confirm-costs:
    parameters: [{ $ref: '#/components/parameters/CancellationId'}]
    post:
      operationId: confirmCancellationCosts
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmCancellationCostsCommand'}}}}
      responses: {'200': {description: Costs confirmed}}
  /api/v1/cancellation-requests/{cancellationId}/approve:
    parameters: [{ $ref: '#/components/parameters/CancellationId'}]
    post:
      operationId: approveCancellation
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Cancellation approved}}
  /api/v1/cancellation-requests/{cancellationId}/accept:
    parameters: [{ $ref: '#/components/parameters/CancellationId'}]
    post:
      operationId: acceptCancellation
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Cancellation accepted}}
  /api/v1/cancellation-requests/{cancellationId}/reject:
    parameters: [{ $ref: '#/components/parameters/CancellationId'}]
    post:
      operationId: rejectCancellation
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'200': {description: Cancellation rejected}}
  /api/v1/cancellation-requests/{cancellationId}/withdraw:
    parameters: [{ $ref: '#/components/parameters/CancellationId'}]
    post:
      operationId: withdrawCancellation
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Cancellation withdrawn}}
  /api/v1/dictionaries/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string, maxLength: 100}
    get:
      operationId: getDictionary
      security: [{bearerAuth: []}]
      parameters:
        - name: stageType
          in: query
          required: false
          schema: {$ref: '#/components/schemas/StageType'}
      responses:
        '200':
          description: Dictionary values
          content: {application/json: {schema: {$ref: '#/components/schemas/DictionaryView'}}}
  /api/v1/requests/{requestId}/from-rejected:
    parameters: [{ $ref: '#/components/parameters/RequestId'}]
    post:
      operationId: createRequestFromRejected
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'201': {description: New request created from rejected request}}
  /api/v1/archive/requests:
    get:
      operationId: listArchivedRequests
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: closedFrom, in: query, required: false, schema: {type: string, format: date}}
        - {name: closedTo, in: query, required: false, schema: {type: string, format: date}}
        - {name: segment, in: query, required: false, schema: {type: string}}
        - { $ref: '#/components/parameters/Page'}
        - { $ref: '#/components/parameters/Size'}
        - { $ref: '#/components/parameters/Sort'}
      responses: {'200': {description: Archived requests}}
  /api/v1/exports/requests:
    post:
      operationId: createRequestsExport
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExportCommand'}}}}
      responses: {'202': {description: Export started}}
  /api/v1/exports/{exportId}:
    parameters:
      - name: exportId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getRequestsExport
      security: [{bearerAuth: []}]
      responses: {'200': {description: Export status}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    CommercialTermsCommand:
      type: object
      required: [tariffType, contractType, version]
      properties:
        tariffType: {type: string, enum: [STANDARD, INDIVIDUAL]}
        contractType: {type: string, enum: [OFFER, STANDARD, CLIENT_FORM]}
        discountPercent: {type: string, pattern: '^[0-9]{1,3}\.[0-9]{2}$'}
        speedMbps: {type: integer, minimum: 1, maximum: 100000}
        version: {type: integer, minimum: 0}
    UpdateRequestDataCommand:
      type: object
      required: [version]
      additionalProperties: false
      description: 'JSON Merge Patch: omitted fields remain unchanged, null clears the field.'
      properties:
        version: {type: integer, minimum: 0}
        address: {type: string, maxLength: 500}
        requestedSpeedMbps: {type: integer, minimum: 1, maximum: 100000}
        desiredDate: {type: string, format: date, nullable: true}
        contactName: {type: string, maxLength: 255, nullable: true}
        contactPhone: {type: string, maxLength: 32, nullable: true}
        contractPreference: {type: string, enum: [OFFER, STANDARD, CLIENT_FORM]}
        clientComment: {type: string, maxLength: 4000}
        tariffType: {type: string, enum: [STANDARD, INDIVIDUAL]}
        discountPercent: {type: string, pattern: '^[0-9]{1,3}\.[0-9]{2}$', nullable: true}
        speedMbps: {type: integer, minimum: 1, maximum: 100000}
        contractType: {type: string, enum: [OFFER, STANDARD, CLIENT_FORM]}
    ContractConcludedCommand:
      type: object
      required: [contractNumber, concludedAt, version]
      properties:
        contractNumber: {type: string, maxLength: 100}
        concludedAt: {type: string, format: date}
        version: {type: integer, minimum: 0}
    SlaExtendPauseCommand:
      type: object
      required: [comment, version]
      properties:
        comment: {type: string, maxLength: 4000}
        version: {type: integer, minimum: 0}
    AssignStageCommand:
      type: object
      required: [assigneeId, version]
      properties: {assigneeId: {type: string, format: uuid}, version: {type: integer, minimum: 0}}
    TechResultCommand:
      type: object
      required: [result, version]
      properties: {result: {type: string}, capex: {type: string, pattern: '^[0-9]+\.[0-9]{2}$'}, constructionDays: {type: integer}, reasonCode: {type: string}, comment: {type: string}, version: {type: integer, minimum: 0}}
    PauseCommand:
      type: object
      required: [reasonCode, comment, version]
      properties: {reasonCode: {type: string}, comment: {type: string, maxLength: 4000}, version: {type: integer, minimum: 0}}
    VersionCommand:
      type: object
      required: [version]
      properties: {version: {type: integer, minimum: 0}}
    AssignManagerCommand:
      type: object
      required: [version, managerId]
      properties:
        version: {type: integer, minimum: 0}
        managerId: {type: string, format: uuid}
    StageType:
      type: string
      enum: [TECH_CHECK, RECHECK_TECH, LEGAL_APPROVAL, FINANCE_APPROVAL, PROCUREMENT_APPROVAL, MGMT_APPROVAL, CONTRACT_SIGNING, CONSTRUCTION, INSTALLATION, ACTIVATION, REMEDIATION, CLOSING]
    StageProblemCommand:
      type: object
      required: [problem, comment, version]
      additionalProperties: false
      properties:
        problem: {type: string, enum: [NO_ACCESS, CONNECTION_IMPOSSIBLE]}
        comment: {type: string, minLength: 1, maxLength: 4000}
        version: {type: integer, minimum: 0}
    DefectClaimCommand:
      type: object
      required: [reason, version]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 4000}
        version: {type: integer, minimum: 0}
    CancellationRequestCommand:
      type: object
      required: [reasonCode, version]
      additionalProperties: false
      properties:
        reasonCode: {type: string, minLength: 1, maxLength: 100}
        comment: {type: string, maxLength: 4000}
        version: {type: integer, minimum: 0}
    CancellationCostItem:
      type: object
      required: [description, amount]
      additionalProperties: false
      properties:
        description: {type: string, minLength: 1, maxLength: 500}
        amount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$'}
    CancellationCostsCommand:
      type: object
      required: [amount, breakdown, version]
      additionalProperties: false
      properties:
        amount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$'}
        breakdown: {type: array, minItems: 1, items: {$ref: '#/components/schemas/CancellationCostItem'}}
        comment: {type: string, maxLength: 4000}
        version: {type: integer, minimum: 0}
    ConfirmCancellationCostsCommand:
      type: object
      required: [confirmed, version]
      additionalProperties: false
      properties:
        confirmed: {type: boolean}
        comment: {type: string, maxLength: 4000}
        version: {type: integer, minimum: 0}
    ExportCommand:
      oneOf:
        - $ref: '#/components/schemas/CsvExportCommand'
        - $ref: '#/components/schemas/PdfExportCommand'
    CsvExportCommand:
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format: {type: string, enum: [CSV]}
        filters: {type: object, additionalProperties: true}
    PdfExportCommand:
      type: object
      required: [format, requestId]
      additionalProperties: false
      properties:
        format: {type: string, enum: [PDF]}
        requestId: {type: string, format: uuid}
    PageInfo:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    RequestRevisionPage:
      type: object
      required: [content, page]
      properties:
        content: {type: array, items: {type: object, additionalProperties: true}}
        page: {$ref: '#/components/schemas/PageInfo'}
    RouteView:
      type: object
      required: [requestId, routeVersion, stages]
      properties:
        requestId: {type: string, format: uuid}
        routeVersion: {type: integer}
        requestClass: {type: string}
        construction: {type: boolean}
        stages: {type: array, items: {type: object, additionalProperties: true}}
    CancellationRequestPage:
      type: object
      required: [content, page]
      properties:
        content: {type: array, items: {type: object, additionalProperties: true}}
        page: {$ref: '#/components/schemas/PageInfo'}
    DictionaryView:
      type: object
      required: [name, items]
      properties:
        name: {type: string}
        items: {type: array, items: {type: object, additionalProperties: true}}
  parameters:
    CorrelationId: {name: X-Correlation-Id, in: header, required: false, schema: {type: string, maxLength: 100}}
    ActiveRole: {name: X-Active-Role, in: header, required: false, schema: {type: string, maxLength: 50}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 100}}
    RequestId: {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    StageId: {name: stageId, in: path, required: true, schema: {type: string, format: uuid}}
    NotificationId: {name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}
    CompanyId: {name: companyId, in: path, required: true, schema: {type: string, format: uuid}}
    CancellationId: {name: cancellationId, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Sort: {name: sort, in: query, required: false, schema: {type: string, maxLength: 100}}
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            type: object
            required: [code, retryable, correlationId]
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              detail: {type: string}
              code: {type: string}
              retryable: {type: boolean}
              correlationId: {type: string}

