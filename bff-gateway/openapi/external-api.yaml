openapi: 3.0.3
info:
  title: B2B Order Flow External API
  version: 0.1.0
  description: Public UI-facing contract. Business rules and authorization are enforced by core-service.
servers:
  - url: /
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses: {'200': {description: Successful login}, '401': { $ref: '#/components/responses/Problem'}}
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'201': {description: Registered}, '400': { $ref: '#/components/responses/Problem'}}
  /api/v1/me:
    get:
      operationId: getMe
      security: [{bearerAuth: []}]
      responses: {'200': {description: Current user}}
  /api/v1/companies:
    post:
      operationId: registerCompany
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses: {'201': {description: Company registered}, '400': { $ref: '#/components/responses/Problem'}}
  /api/v1/companies/{companyId}:
    get:
      operationId: getCompany
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/CompanyId'}]
      responses: {'200': {description: Company}, '404': { $ref: '#/components/responses/Problem'}}
  /api/v1/admin/companies:
    get:
      operationId: listPendingCompanies
      security: [{bearerAuth: []}]
      responses: {'200': {description: Pending companies}}
  /api/v1/admin/companies/{companyId}/confirm:
    post:
      operationId: confirmCompany
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/CompanyId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'200': {description: Confirmed}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/admin/companies/{companyId}/reject:
    post:
      operationId: rejectCompany
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/CompanyId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'200': {description: Rejected}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests:
    get:
      operationId: listRequests
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/CorrelationId'}, { $ref: '#/components/parameters/ActiveRole'}, { $ref: '#/components/parameters/Page'}, { $ref: '#/components/parameters/Size'}, { $ref: '#/components/parameters/Sort'}]
      responses: {'200': {description: Request list}}
    post:
      operationId: createRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/CorrelationId'}, { $ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses: {'201': {description: Draft created}, '422': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}:
    get:
      operationId: getRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      responses: {'200': {description: Request card}, '404': { $ref: '#/components/responses/Problem'}}
    patch:
      operationId: updateRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'200': {description: Updated}, '409': { $ref: '#/components/responses/Problem'}}
    delete:
      operationId: deleteRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      responses: {'204': {description: Deleted}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}/submit:
    post:
      operationId: submitRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Submitted}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}/claim:
    post:
      operationId: claimRequest
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}, { $ref: '#/components/parameters/ActiveRole'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Claimed}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}/assign-manager:
    post:
      operationId: assignManager
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}, { $ref: '#/components/parameters/ActiveRole'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignManagerCommand'}}}}
      responses: {'200': {description: Manager assigned}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}/recheck-data:
    post:
      operationId: recheckData
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionCommand'}}}}
      responses: {'200': {description: Rechecked}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}/history:
    get:
      operationId: getRequestHistory
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      responses: {'200': {description: Request history}}
  /api/v1/requests/{requestId}/commercial-terms:
    post:
      operationId: setCommercialTerms
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}
      responses: {'200': {description: Terms saved}, '422': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}/offers:
    get:
      operationId: listOffers
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      responses: {'200': {description: Service offers}}
    post:
      operationId: addOffer
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}
      responses: {'201': {description: Offer added}, '422': { $ref: '#/components/responses/Problem'}}
  /api/v1/requests/{requestId}/offers/{offerId}/select:
    post:
      operationId: selectOffer
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}, {name: offerId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}
      responses: {'200': {description: Offer selected}, '409': { $ref: '#/components/responses/Problem'}}
  /api/v1/stages:
    get:
      operationId: listStages
      security: [{bearerAuth: []}]
      responses: {'200': {description: Stage queue}}
  /api/v1/stages/my:
    get:
      operationId: myStages
      security: [{bearerAuth: []}]
      responses: {'200': {description: My stages}}
  /api/v1/requests/{requestId}/sla:
    get:
      operationId: requestSla
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/RequestId'}]
      responses: {'200': {description: SLA information}}
  /api/v1/notifications:
    get:
      operationId: listNotifications
      security: [{bearerAuth: []}]
      responses: {'200': {description: Notifications}}
  /api/v1/notifications/{notificationId}/read:
    post:
      operationId: readNotification
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/NotificationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}
      responses: {'200': {description: Marked as read}}
  /api/v1/notifications/read-all:
    post:
      operationId: readAllNotifications
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}
      responses: {'200': {description: Marked as read}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Command:
      type: object
      required: [version]
      properties: {version: {type: integer, minimum: 0}}
    VersionCommand:
      type: object
      required: [version]
      properties: {version: {type: integer, minimum: 0}}
    AssignManagerCommand:
      type: object
      required: [version, managerId]
      properties:
        version: {type: integer, minimum: 0}
        managerId: {type: string, format: uuid}
  parameters:
    CorrelationId: {name: X-Correlation-Id, in: header, required: false, schema: {type: string, maxLength: 100}}
    ActiveRole: {name: X-Active-Role, in: header, required: false, schema: {type: string, maxLength: 50}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 100}}
    RequestId: {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    CompanyId: {name: companyId, in: path, required: true, schema: {type: string, format: uuid}}
    NotificationId: {name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Sort: {name: sort, in: query, required: false, schema: {type: string, maxLength: 100}}
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            type: object
            required: [code, retryable, correlationId]
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              detail: {type: string}
              code: {type: string}
              retryable: {type: boolean}
              correlationId: {type: string}

