      summary: Акцепт оферты клиентом (T13)
      description: |
        Представитель компании-клиента акцептует оферту в системе. Заявка переходит
        `CONTRACT_SIGNING → IN_EXECUTION`, заполняется `contract_concluded_at`, уровень
        обязательств — 1, создаётся первый этап исполнения (docs/system/status-model.md, T13).
