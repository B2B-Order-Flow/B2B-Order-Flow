    CommercialTermsPayload:
      type: object
      description: |
        Тело T04 (docs/system/api-contract.md, 6.13 и 10.7). Скидка обязательна при
        `tariffType = INDIVIDUAL`; это проверяет ядро.
      required: [tariffType, contractType, version]
      properties:
        tariffType:
          $ref: '#/components/schemas/TariffType'
        discountPercent:
          type: string
          description: |
            Проценты строкой с двумя знаками, от `"0.00"` до `"100.00"`. Значение больше
            `"100.00"` — `INVALID` по правилу формата (docs/system/api-contract.md, 10.7);
            границу проверяет ядро, шаблон проверяет только форму записи.
          pattern: '^[0-9]{1,3}\.[0-9]{2}$'
          example: '15.00'
        contractType:
          $ref: '#/components/schemas/ContractType'
        speedMbps:
          type: integer
          minimum: 1
          maximum: 100000
          description: Если не передан, берётся `requestedSpeedMbps` заявки
        version:
          type: integer
          format: int64
          minimum: 0
    StageAssignPayload:
      type: object
      required: [assigneeId, version]
      properties:
        assigneeId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
    TechResultPayload:
      type: object
      description: |
        Тело результата ТВ (docs/system/api-contract.md, 6.13 и 10.8). Обязательность полей
        зависит от `result`: `capex` и `constructionDays` — при `WITH_CONSTRUCTION`,
        `reasonCode` — при `NONE`, `comment` — при `reasonCode = OTHER`.
      required: [result, version]
      properties:
        result:
          $ref: '#/components/schemas/TechResult'
        capex:
          type: string
          description: Деньги строкой с двумя знаками, больше нуля
          pattern: '^[0-9]+\.[0-9]{2}$'
          example: '300000.00'
        constructionDays:
          type: integer
          minimum: 1
          description: Календарные дни стройки
        reasonCode:
          type: string
          description: |
            Код из справочника `rejection_reason` для шага ТВ. На неделе 2 в справочнике
            есть только `OTHER` (списки причин по шагам готовит бизнес-аналитик), поэтому
            интерфейс фиксирует этот код у себя, а комментарий при `OTHER` обязателен.
            Общий справочник `GET /dictionaries/{name}` (docs/system/api-contract.md, 6.11)
            появится вместе со списками причин отдельным изменением контракта на неделе 3.
        comment:
          type: string
          maxLength: 4000
        version:
          type: integer
          format: int64
          minimum: 0
    ContractConcludedPayload:
      type: object
      required: [contractNumber, concludedAt, version]
      properties:
        contractNumber:
          type: string
          maxLength: 100
        concludedAt:
          type: string
          format: date
          description: Дата подписания, не позже сегодняшней
        version:
          type: integer
          format: int64
          minimum: 0
