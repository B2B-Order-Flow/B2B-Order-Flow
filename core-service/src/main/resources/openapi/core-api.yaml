openapi: 3.0.3
info:
  title: B2B-Order-Flow Core API
  version: 0.2.0
  description: |
    Внутренний контракт транзакционного ядра B2B-Order-Flow. Единственный источник истины
    для API: серверные интерфейсы генерируются из этого файла (`openapi-generator`), контроллеры
    их реализуют. Изменения контракта — отдельным PR с ревью Дениса.

    ## Доступ
    Все пути начинаются с `/internal/v1` и доступны только из приватной сети Docker.
    Каждый запрос обязан содержать `X-Internal-Token` (запрос без него получает `401`).
    Защищённые операции дополнительно требуют `Authorization: Bearer <JWT>` ядра.

    ## Активная роль
    Если у пользователя несколько ролей, защищённая операция принимает `X-Active-Role`.
    Без заголовка при единственной роли используется она; при нескольких — `422 ACTIVE_ROLE_REQUIRED`.
    Переданная роль, которой у пользователя нет, отклоняется с `403`. Решение о правах
    принимается по актуальным данным БД, а не только по JWT.

    ## Ошибки
    Ошибки возвращаются как `application/problem+json` (RFC 9457) с полями `code`,
    `correlationId`, `retryable` и, для `422`, `violations`. `X-Correlation-Id` принимается
    от клиента, генерируется при отсутствии и возвращается в ответе.

    ## Идемпотентность и версии
    Создание заявки и компании поддерживает `Idempotency-Key`. Действия, меняющие состояние
    заявки, принимают `version` в теле; устаревшая версия — `409 VERSION_CONFLICT`.
    Повторный вызов перехода из уже изменённого статуса — `409 ILLEGAL_TRANSITION`.

    ## Пагинация
    Списки страничные: `page` (с нуля), `size` (по умолчанию 20, максимум 100), `sort`
    (`field,asc|desc`). Фильтры и сортировка — только по колонкам БД.

    ## Что решает ядро
    Бизнес-валидация, права, статусы, принадлежность компании и фильтрация полей по роли.
    BFF проксирует ответ без фильтрации.

    ## Неделя 2
    Контракт недели 2 покрывает переходы SC-01: T04, T05, T07, T13, T14, T16, T18
    (docs/plan-week2.md, раздел 2). Согласования, стройка, доработка, отмена и повторная
    техническая возможность появятся на неделе 3: их эндпоинтов здесь нет, а результат ТВ
    `WITH_CONSTRUCTION` до недели 3 отклоняется с `409 ILLEGAL_TRANSITION`.
servers:
  - url: http://core-service:8080
    description: Приватная сеть Docker Compose
security:
  - internalToken: []
    bearerAuth: []
tags:
  - name: Auth
    description: Аутентификация и токен
  - name: Companies
    description: Компании-клиенты
  - name: Admin
    description: Администрирование компаний
  - name: Requests
    description: Заявки и их переходы
  - name: Workflow
    description: Переходы заявки недели 2 (T04, T05, T07, T13, T18)
  - name: Stages
    description: Очередь роли и команды этапов
paths:
  /internal/v1/auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: Зарегистрировать пользователя платформы
      description: Гость регистрируется на платформе. Компания регистрируется отдельно.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Войти и получить JWT
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Токен выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Текущий пользователь
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /internal/v1/companies:
    post:
      operationId: registerCompany
      tags: [Companies]
      summary: Зарегистрировать компанию
      description: |
        Создаёт компанию в статусе `PENDING` и делает зарегистрировавшего её пользователя
        владельцем (`CLIENT_OWNER`). ИНН проверяется локально и в справочнике клиентов.
        Дубль активного ИНН — `409 COMPANY_INN_EXISTS`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCompanyRequest'
      responses:
        '201':
          description: Компания создана и ожидает подтверждения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/companies/{companyId}:
    get:
      operationId: getCompany
      tags: [Companies]
      summary: Карточка компании
      description: Доступна участникам компании и администратору; остальным — `404`.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Компания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /internal/v1/admin/companies:
    get:
      operationId: listCompaniesForConfirmation
      tags: [Admin]
      summary: Очередь подтверждения компаний
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CompanyStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Страница компаний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /internal/v1/admin/companies/{companyId}/confirm:
    post:
      operationId: confirmCompany
      tags: [Admin]
      summary: Подтвердить компанию
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyDecisionRequest'
      responses:
        '200':
          description: Компания подтверждена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyView'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /internal/v1/admin/companies/{companyId}/reject:
    post:
      operationId: rejectCompany
      tags: [Admin]
      summary: Отклонить компанию
      description: Причина обязательна, иначе `422 VALIDATION_FAILED`.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyDecisionRequest'
      responses:
        '200':
          description: Компания отклонена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyView'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /internal/v1/requests:
    post:
      operationId: createRequest
      tags: [Requests]
      summary: Создать черновик заявки
      description: |
        Доступно представителю подтверждённой компании (`CLIENT_OWNER`, `CLIENT_ADMIN`,
        `CLIENT_REQUESTER`). Вместе с заявкой создаётся одно предложение услуги (`SELECTED`),
        чтобы выполнялось правило «не менее одного `service_offer` на заявку».
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestPayload'
      responses:
        '201':
          description: Черновик создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      operationId: listRequests
      tags: [Requests]
      summary: Список заявок
      description: |
        Клиент видит только заявки своей компании. Менеджер — свои заявки и очередь
        нераспределённых (`status=DATA_CHECK`, `unassigned=true`, данные проверены).
        Координатор и руководитель B2B — все. Прочие исполнители — заявки, где у них есть
        этап. Администратор списка не видит (`403`).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RequestStatus'
        - name: companyId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: managerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: unassigned
          in: query
          required: false
          description: Только заявки без менеджера
          schema:
            type: boolean
      responses:
        '200':
          description: Страница заявок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /internal/v1/requests/{requestId}:
    get:
      operationId: getRequest
      tags: [Requests]
      summary: Карточка заявки
      description: |
        Чужая заявка возвращает `404` (EC-16), попытка пишется в `audit_log`.
        Клиентская версия не содержит исполнителей, внутренних сумм и служебных полей.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateDraft
      tags: [Requests]
      summary: Исправить черновик
      description: Только автор заявки и только в статусе `DRAFT`; нужен `version`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequestPayload'
      responses:
        '200':
          description: Черновик обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    delete:
      operationId: deleteDraft
      tags: [Requests]
      summary: Удалить неотправленный черновик
      description: Мягкое удаление (`deleted_at`), доступно только автору в статусе `DRAFT`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '204':
          description: Черновик удалён
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /internal/v1/requests/{requestId}/submit:
    post:
      operationId: submitRequest
      tags: [Requests]
      summary: Отправить заявку оператору (T01)
      description: |
        Транзакция 1 проверяет данные, создаёт ревизию, ставит `DATA_CHECK` и пишет аудит.
        Затем вне транзакции параллельно опрашиваются CRM, биллинг и справочник; результаты
        сохраняются второй транзакцией. Если все системы ответили — T03, при известном
        менеджере CRM сразу T03b (`WITH_MANAGER`). Сбой внешней системы не откатывает
        заявку: она остаётся в `DATA_CHECK` с `integrationError: true` (EC-10),
        а ответ всё равно `200` с предупреждением `EXTERNAL_SYSTEM_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Заявка принята; статус и предупреждения — в теле
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /internal/v1/requests/{requestId}/recheck-data:
    post:
      operationId: recheckRequestData
      tags: [Requests]
      summary: Повторная проверка данных (T02/T03, EC-10)
      description: |
        Координатор повторяет проверку только по системам, которые ещё не ответили успешно.
        Уже полученные данные не перезаписываются. Заявка остаётся в `DATA_CHECK`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Результат повторной проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /internal/v1/requests/{requestId}/claim:
    post:
      operationId: claimRequest
      tags: [Requests]
      summary: Взять заявку из очереди менеджеров (T03b)
      description: |
        Менеджер по продажам берёт заявку, у которой ещё нет менеджера и данные проверены.
        Заявка переходит в `WITH_MANAGER`, `manager_id` заполняется текущим пользователем.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Заявка взята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /internal/v1/requests/{requestId}/assign-manager:
    post:
      operationId: assignManager
      tags: [Requests]
      summary: Назначить или переназначить менеджера (T03b, EC-19)
      description: |
        Координатор назначает менеджера, когда очередь пуста (T03b), или переназначает
        менеджера в любом нетерминальном статусе (раздел 6.5 статусной модели). Назначаемый
        пользователь должен быть активен и иметь роль `SALES_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignManagerPayload'
      responses:
        '200':
          description: Менеджер назначен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /internal/v1/requests/{requestId}/history:
    get:
      operationId: getRequestHistory
      tags: [Requests]
      summary: История действий по заявке
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница записей аудита
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryPage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /internal/v1/requests/{requestId}/commercial-terms:
    post:
      operationId: setCommercialTerms
      tags: [Workflow]
      summary: Зафиксировать коммерческие условия и отправить в работу (T04)
      description: |
        Менеджер заявки фиксирует тариф, скидку и тип договора. Заявка переходит
        `WITH_MANAGER → TECH_CHECK`, строится предварительный маршрут (R-01…R-04, R-07),
        в очередь `TECH_SPECIALIST` создаётся этап `TECH_CHECK` (docs/system/routing-rules.md,
        разделы 5 и 6.1). `discountPercent` обязателен при `tariffType = INDIVIDUAL`;
        если `speedMbps` не передан, берётся скорость из заявки. Ответ — карточка заявки
        с актуальным маршрутом (`stages`).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialTermsPayload'
      responses:
        '200':
          description: Условия зафиксированы, заявка в `TECH_CHECK`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/requests/{requestId}/contract/sent:
    post:
      operationId: markContractSent
      tags: [Workflow]
      summary: Отметка «Договор отправлен» (автопауза SLA)
      description: |
        Менеджер заявки отмечает отправку договора клиенту. Таймер этапа
        `CONTRACT_SIGNING` встаёт на автопаузу `AWAIT_CLIENT_SIGNATURE`
        (docs/system/sla.md, 6.1) и снимается переходом T13. Статус заявки не меняется.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Отметка поставлена, таймер на паузе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/requests/{requestId}/contract/concluded:
    post:
      operationId: concludeContract
      tags: [Workflow]
      summary: Договор заключён по отметке менеджера (T13)
      description: |
        Менеджер заявки вносит номер и дату подписанного договора. Заявка переходит
        `CONTRACT_SIGNING → IN_EXECUTION`, заполняется `contract_concluded_at`, уровень
        обязательств становится 1, создаётся первый этап исполнения (`INSTALLATION`),
        пауза «ожидание подписи» снимается (docs/system/status-model.md, T13).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractConcludedPayload'
      responses:
        '200':
          description: Договор заключён, заявка в `IN_EXECUTION`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/requests/{requestId}/contract/accept-offer:
    post:
      operationId: acceptOffer
      tags: [Workflow]
      summary: Акцепт оферты клиентом (T13)
      description: |
        Представитель компании-клиента акцептует оферту в системе. Заявка переходит
        `CONTRACT_SIGNING → IN_EXECUTION`, заполняется `contract_concluded_at`, уровень
        обязательств — 1, создаётся первый этап исполнения (docs/system/status-model.md, T13).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Оферта акцептована, заявка в `IN_EXECUTION`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/requests/{requestId}/act/sent:
    post:
      operationId: markActSent
      tags: [Workflow]
      summary: Отметка «Акт отправлен» (пауза и срок приёмки)
      description: |
        Менеджер заявки в статусе `ACTIVATED` отмечает отправку акта. Таймер этапа
        `CLOSING` встаёт на автопаузу `AWAIT_CLIENT_SIGNATURE`, запускается срок приёмки:
        5 рабочих дней в `PROD`, 3 минуты в `DEMO` (docs/system/sla.md, 8), с напоминанием
        клиенту. Статус заявки не меняется.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Акт отмечен отправленным
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/requests/{requestId}/act/signed:
    post:
      operationId: signAct
      tags: [Workflow]
      summary: Акт подписан, заявка закрыта (T18)
      description: |
        Менеджер заявки фиксирует подписанный акт. Заявка переходит `ACTIVATED → CLOSED`,
        заполняется `closed_at`, `acceptedByDefault` не меняется, все активные таймеры
        останавливаются. Требуется отметка «Акт отправлен» и отсутствие открытого этапа
        `REMEDIATION` (docs/system/status-model.md, T18).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Заявка закрыта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/requests/{requestId}/close-by-default:
    post:
      operationId: closeByDefault
      tags: [Workflow]
      summary: Закрытие «Принято по умолчанию» (T18)
      description: |
        Менеджер закрывает заявку после истечения срока приёмки без претензии клиента.
        Заявка переходит `ACTIVATED → CLOSED`, `closed_at` заполняется,
        `accepted_by_default = true`. До истечения срока приёмки — `409 ILLEGAL_TRANSITION`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Заявка закрыта по умолчанию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/stages:
    get:
      operationId: listStages
      tags: [Stages]
      summary: Очередь этапов роли
      description: |
        Этапы с фильтром по роли очереди `queueRole` и статусу `status`. Очередь роли —
        это `status=QUEUED` (docs/system/status-model.md, 4.2). Исполнитель видит очередь
        только своей роли, координатор — очереди всех ролей. Этапы `CONTRACT_SIGNING`
        и `CLOSING` в очередь не попадают. Сортировка по умолчанию — по остатку SLA.
      parameters:
        - name: queueRole
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Role'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StageStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Страница этапов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagePage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/stages/my:
    get:
      operationId: listMyStages
      tags: [Stages]
      summary: «Мои задачи» — этапы текущего исполнителя
      description: Активные этапы (`QUEUED` и `IN_PROGRESS`), где исполнитель — текущий
        пользователь, по возрастанию остатка SLA. Фильтров нет.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница этапов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagePage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/stages/{stageId}/claim:
    post:
      operationId: claimStage
      tags: [Stages]
      summary: Взять этап в работу
      description: |
        Этап переходит `QUEUED → IN_PROGRESS`, `assignee_id` — текущий пользователь,
        `taken_at` заполняется. Если это первый этап исполнения, наступает T14: пишется
        `work_started_at`, уровень обязательств — 2 (docs/system/status-model.md, 6.1.2).
        Этап не в очереди активной роли — `403 STAGE_NOT_IN_YOUR_QUEUE`.
      parameters:
        - $ref: '#/components/parameters/StageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Этап взят в работу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/stages/{stageId}/assign:
    post:
      operationId: assignStage
      tags: [Stages]
      summary: Назначить или переназначить исполнителя этапа
      description: |
        Координатор назначает исполнителя: этап `QUEUED → IN_PROGRESS`, `assignee_id`
        заполняется, `needs_reassignment` снимается. Для первого этапа исполнения
        наступает T14. Назначаемый пользователь должен быть активен и иметь роль очереди
        этапа; иначе `422 VALIDATION_FAILED`.
      parameters:
        - $ref: '#/components/parameters/StageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageAssignPayload'
      responses:
        '200':
          description: Исполнитель назначен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/stages/{stageId}/tech-result:
    post:
      operationId: setTechResult
      tags: [Stages]
      summary: Результат проверки технической возможности (T05, T07)
      description: |
        Технический специалист вносит результат этапа `TECH_CHECK`. `AVAILABLE` — T07:
        заявка в `CONTRACT_SIGNING`, создаётся одноимённый этап сразу на менеджера заявки.
        `NONE` — T05: заявка `REJECTED`, причина из справочника `rejection_reason` для шага
        ТВ, при `reasonCode = OTHER` комментарий обязателен, остальные этапы `CANCELLED`.
        `WITH_CONSTRUCTION` до недели 3 — `409 ILLEGAL_TRANSITION` (T06 и стройка на неделе 3).
        Заявка в ответе не возвращается: актуальный статус — `GET /requests/{requestId}`.
      parameters:
        - $ref: '#/components/parameters/StageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechResultPayload'
      responses:
        '200':
          description: Результат зафиксирован, этап завершён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/stages/{stageId}/complete:
    post:
      operationId: completeStage
      tags: [Stages]
      summary: Этап исполнения выполнен (монтаж, настройка)
      description: |
        Инженер отмечает выполнение этапа исполнения: `IN_PROGRESS → DONE`, `finished_at`
        заполняется. После `INSTALLATION` создаётся `ACTIVATION`, после `CONSTRUCTION` —
        `INSTALLATION` (docs/system/status-model.md, 6.1.2). Статус заявки не меняется.
      parameters:
        - $ref: '#/components/parameters/StageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Этап завершён, следующий этап создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/stages/{stageId}/activate:
    post:
      operationId: activateStage
      tags: [Stages]
      summary: Тест пройден, услуга активирована (T16)
      description: |
        Инженер завершает этап `ACTIVATION`: заявка переходит `IN_EXECUTION → ACTIVATED`,
        заполняется `activated_at`, уровень обязательств — 3, создаётся этап `CLOSING`
        для менеджера заявки. Требование: монтаж выполнен (`INSTALLATION` в `DONE`).
      parameters:
        - $ref: '#/components/parameters/StageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Услуга активирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Общий секрет BFF → ядро из переменной окружения.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT пользователя, выдаётся и проверяется только ядром.
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Ключ идемпотентности (UUID). Повтор с тем же ключом и телом возвращает исходный
        результат; с другим телом — `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: Поле и направление, например `createdAt,desc`.
      schema:
        type: string
        default: createdAt,desc
  responses:
    ValidationError:
      description: Ошибка валидации бизнес-правил
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnauthorizedError:
      description: Нет токена, токен истёк или неверный межсервисный токен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenError:
      description: Роль или принадлежность компании не позволяют действие
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundError:
      description: Объекта нет или он недоступен пользователю
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConflictError:
      description: Конфликт версии, статуса или повторного действия
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Необработанная ошибка ядра
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Ошибка в формате RFC 9457 с машинным кодом.
      required: [type, title, status, code, correlationId, retryable]
      properties:
        type:
          type: string
          example: https://b2b-order-flow/errors/illegal-transition
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          example: ILLEGAL_TRANSITION
        correlationId:
          type: string
        retryable:
          type: boolean
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    Violation:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Warning:
      type: object
      description: 'Не ошибка: заявка принята, но что-то требует внимания.'
      required: [code, message]
      properties:
        code:
          type: string
          example: EXTERNAL_SYSTEM_UNAVAILABLE
        message:
          type: string
    PageInfo:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    RegisterUserRequest:
      type: object
      required: [login, password, fullName, email]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 100
        fullName:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
          example: 28800
        user:
          $ref: '#/components/schemas/UserView'
    UserView:
      type: object
      required: [id, login, fullName, email]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        fullName:
          type: string
        email:
          type: string
        companyRoles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        operatorRoles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanyBrief'
    CompanyBrief:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/CompanyStatus'
    RegisterCompanyRequest:
      type: object
      required: [name, inn, legalAddress]
      properties:
        name:
          type: string
          maxLength: 500
        inn:
          type: string
          description: 10 цифр для организации, 12 — для ИП
        kpp:
          type: string
          maxLength: 9
        ogrn:
          type: string
          maxLength: 15
        legalAddress:
          type: string
          maxLength: 500
    CompanyDecisionRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
          description: Обязательна для отклонения.
        comment:
          type: string
          maxLength: 4000
    CompanyView:
      type: object
      required: [id, name, inn, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        inn:
          type: string
        kpp:
          type: string
        ogrn:
          type: string
        legalAddress:
          type: string
        status:
          $ref: '#/components/schemas/CompanyStatus'
        rejectReason:
          type: string
        confirmedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CompanyPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CompanyView'
        page:
          $ref: '#/components/schemas/PageInfo'
    CreateRequestPayload:
      type: object
      description: |
        Поля черновика. Обязательность бизнес-полей проверяется при отправке (T01),
        а не при создании черновика: клиент заполняет заявку постепенно.
      properties:
        address:
          type: string
          maxLength: 500
        requestedSpeedMbps:
          type: integer
          minimum: 1
          maximum: 100000
        desiredDate:
          type: string
          format: date
        contactName:
          type: string
          maxLength: 255
        contactPhone:
          type: string
          maxLength: 32
        contractPreference:
          $ref: '#/components/schemas/ContractType'
        clientComment:
          type: string
          maxLength: 4000
    UpdateRequestPayload:
      allOf:
        - $ref: '#/components/schemas/CreateRequestPayload'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64
              minimum: 0
    VersionedAction:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
    AssignManagerPayload:
      type: object
      required: [managerId, version]
      properties:
        managerId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
    ServiceOfferView:
      type: object
      required: [id, status, tariffType, contractType]
      properties:
        id:
          type: string
