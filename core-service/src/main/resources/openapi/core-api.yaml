          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          description: Получатель сигнала (`notification.recipient_user_id`); шлюз рассылает сигнал по соединениям этого пользователя
        createdAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    UpdateRequestDataPayload:
      description: |
        Правка данных в доработке (T09, T09b, T12). Переданные поля заменяются,
        непереданные остаются прежними. Поля предложения услуги влияют на пересборку
        маршрута (docs/system/routing-rules.md, 3 и 7); пересборка выполняется
        повторной отправкой, а не этим запросом.
      allOf:
        - $ref: '#/components/schemas/CreateRequestPayload'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64
              minimum: 0
            tariffType:
              $ref: '#/components/schemas/TariffType'
            discountPercent:
              type: string
              pattern: '^[0-9]{1,3}\.[0-9]{2}$'
              example: '10.00'
              description: |
                Проценты строкой с двумя знаками. Обязательна при `tariffType = INDIVIDUAL`;
                диапазон 0.00–100.00 и обязательность проверяет ядро.
            speedMbps:
              type: integer
              minimum: 1
              maximum: 100000
              description: Скорость в предложении услуги; если не передана, значение не меняется
            contractType:
              $ref: '#/components/schemas/ContractType'
    ApprovalDecision:
      type: string
      description: Решение согласующего по этапу.
      enum: [APPROVE, RETURN, REJECT]
    StageDecisionPayload:
      type: object
      description: |
        Тело решения согласующего (docs/system/api-contract.md, 6.4 и 10.8).
        `comment` обязателен для `RETURN` и `REJECT`; `reasonCode` — для `REJECT`
        и берётся из `rejection_reason` для шага согласования.
      required: [decision, version]
      properties:
        decision:
          $ref: '#/components/schemas/ApprovalDecision'
        comment:
          type: string
          maxLength: 4000
        reasonCode:
          type: string
          description: Код из справочника `rejection_reason` для шага согласования
        version:
          type: integer
          format: int64
          minimum: 0
    StageReturnPayload:
      type: object
      description: Возврат заявки с проверки ТВ (T09b); комментарий обязателен.
      required: [comment, version]
      properties:
        comment:
          type: string
          maxLength: 4000
          description: Что исправить в данных заявки
        version:
          type: integer
          format: int64
          minimum: 0
    RevisionReason:
      type: string
      description: Причина появления ревизии (docs/system/domain-model.md, 4.2).
      enum: [SUBMIT, REWORK, RECALC, RECHECK]
    RevisionChange:
      type: object
      description: Одно изменившееся поле между соседними ревизиями.
      required: [field]
      properties:
        field:
          type: string
          example: requestedSpeedMbps
        previousValue:
          type: string
          description: Значение в предыдущей ревизии; пусто, если поле появилось
        newValue:
          type: string
          description: Значение в текущей ревизии; пусто, если поле удалено
    RequestRevisionView:
      type: object
      required: [id, revisionNo, reason, createdAt, changes]
      properties:
        id:
          type: string
          format: uuid
        revisionNo:
          type: integer
          minimum: 1
        reason:
          $ref: '#/components/schemas/RevisionReason'
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        params:
          type: object
          additionalProperties: true
          description: Снимок параметров заявки на момент ревизии
        changes:
          type: array
          description: Отличия от предыдущей ревизии; у первой ревизии — от пустого снимка
          items:
            $ref: '#/components/schemas/RevisionChange'
    RequestRevisionPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RequestRevisionView'
        page:
          $ref: '#/components/schemas/PageInfo'
    RouteStageView:
      type: object
      description: |
        Этап плана маршрута. `stageId` и `status` пусты, пока этап не создан
        (например, управленческое согласование второй волны до завершения первой).
      required: [type, wave, requiredByRules]
      properties:
        stageId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/StageType'
        queueRole:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/StageStatus'
        wave:
          type: integer
          minimum: 0
          maximum: 2
          description: Волна согласований; 0 — этап вне волн согласований
        requiredByRules:
          type: array
          description: ID правил маршрутизации, из-за которых появился этап
          items:
            type: string
            example: R-01
    RouteView:
      type: object
      required: [requestId, routeVersion, stages]
      properties:
        requestId:
          type: string
          format: uuid
        routeVersion:
          type: integer
        requestClass:
          $ref: '#/components/schemas/RequestClass'
        construction:
          type: boolean
          description: В маршруте есть этап `CONSTRUCTION` (ТВ «со стройкой»)
        stages:
          type: array
          description: Этапы плана в порядке прохождения
          items:
            $ref: '#/components/schemas/RouteStageView'
    StageSlaStatus:
      type: string
      description: |
        Краткий статус срока этапа: `RUNNING` — идёт, `PAUSED` — на паузе,
        `BREACHED` — норматив исчерпан, `STOPPED` — этап закрыт.
      enum: [RUNNING, PAUSED, BREACHED, STOPPED]
    StageSlaSummary:
      type: object
      description: |
        Краткая сводка срока этапа для очередей и «Моих задач»; полный SLA с журналом
        пауз — `GET /internal/v1/requests/{requestId}/sla`.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/StageSlaStatus'
        dueAt:
          type: string
          format: date-time
          description: Момент нарушения при условии, что пауз больше не будет
        remainingMinutes:
          type: integer
          description: Остаток рабочего времени в минутах; отрицательный — просрочка
        overdue:
          type: boolean
          description: Норматив уже исчерпан
