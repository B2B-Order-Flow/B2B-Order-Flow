          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/events/stream:
    get:
      operationId: streamEvents
      tags: [Events]
      summary: Канал событий ядро → шлюз (Server-Sent Events)
      description: |
        Постоянное соединение, которое шлюз открывает при старте (docs/system/api-contract.md, 4.5).
        Каждое событие — строка `data: <JSON EventSignal>`; в сигнале только идентификатор
        события и адресат `userId`, данные клиент забирает по REST. После коммита транзакции
        перехода ядро отправляет сигнал и ставит `notification.published_at`. При подключении
        сначала уходят записи с пустым `published_at` и записи после `Last-Event-ID`, затем новые.
        Доступ — только по `X-Internal-Token`: канал открывает шлюз, пользовательского JWT у
        соединения нет.
      security:
        - internalToken: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Момент `created_at` последнего полученного события.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Поток `text/event-stream`; в каждой строке `data:` — JSON `EventSignal`
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventSignal'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/ws/ticket:
    get:
      operationId: issueWsTicket
      tags: [Events]
      summary: Одноразовый билет для WebSocket
      description: |
        Билет выдаётся аутентифицированному пользователю, живёт 30 секунд, привязан к
        пользователю и активной роли. Шлюз передаёт билет клиенту как есть, а при установке
        соединения проверяет его через `POST /internal/v1/ws/ticket/redeem`
        (docs/system/api-contract.md, 4.4).
      responses:
        '200':
          description: Билет выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTicketView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/ws/ticket/redeem:
    post:
      operationId: redeemWsTicket
      tags: [Events]
      summary: Проверить билет WebSocket при установке соединения
      description: |
        Шлюз передаёт билет ядру перед установкой соединения. Билет одноразовый: повторная
        проверка, истёкший или неизвестный билет — `401 UNAUTHORIZED`. Ответ содержит
        пользователя и активную роль, к которой привязан билет; по ним шлюз регистрирует
        соединение и адресует сигналы (docs/system/api-contract.md, 4.4).
        Доступ — только по `X-Internal-Token`: операцию вызывает шлюз, пользовательского JWT
        в запросе нет (аутентификация пользователя уже выполнена при выдаче билета).
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WsTicketRedeemPayload'
      responses:
        '200':
          description: Билет действителен и помечен использованным
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTicketRedeemView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/users:
    get:
      operationId: listOperatorUsers
      tags: [Users]
      summary: Сотрудники оператора с ролью
      description: |
        Список для выбора исполнителя: координатор назначает менеджера заявки
        (`POST /requests/{requestId}/assign-manager`) и исполнителя этапа
        (`POST /stages/{stageId}/assign`). Возвращаются активные сотрудники оператора
        с ролью `role`; признак `active` нужен интерфейсу, чтобы показать состояние
        учётной записи, но для назначения неактивный пользователь не подходит
        (docs/system/api-contract.md, 6.1). Доступно только координатору (`COORDINATOR`);
        другим ролям — `403 ACCESS_DENIED`.
      parameters:
        - name: role
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Role'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Страница сотрудников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorUserPage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/requests/{requestId}/data:
    patch:
      operationId: updateRequestData
      tags: [Rework]
      summary: Исправить данные заявки после возврата на доработку
      description: |
        Менеджер заявки правит данные после возврата на доработку (T09, T09b, T12).
        Доступно только в статусе `REWORK` и только менеджеру заявки. Меняются поля
        заявки и выбранного предложения услуги; тариф, скидка, скорость и тип договора
        влияют на пересборку маршрута (docs/system/routing-rules.md, 3 и 7). Сама
        пересборка выполняется повторной отправкой (`POST .../resubmit`, T10), а не
        этим запросом. Нужен `version` заявки; устаревшая версия — `409 VERSION_CONFLICT`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequestDataPayload'
      responses:
        '200':
          description: Данные сохранены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/requests/{requestId}/resubmit:
    post:
      operationId: resubmitRequest
      tags: [Rework]
      summary: Отправить заявку повторно после доработки (T10)
      description: |
        Только менеджер заявки и только из статуса `REWORK`. Создаётся новая ревизия
        (`reason = REWORK`), маршрут пересобирается: `routeVersion` растёт, принятые
        решения согласующих сохраняются, если не изменились параметры их области
        решения, иначе помечаются `superseded` и этап создаётся заново
        (docs/system/routing-rules.md, 7). Если заявку возвращал технический специалист,
        она возвращается на тот же этап `TECH_CHECK`; если согласований не осталось —
        в `CONTRACT_SIGNING`, иначе в `IN_APPROVAL`. Автопауза `REWORK` снимается,
        SLA возобновляется. Ответ — карточка заявки с новым статусом и маршрутом.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Заявка отправлена повторно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/requests/{requestId}/revisions:
    get:
      operationId: listRequestRevisions
      tags: [Rework]
      summary: Снимки параметров заявки
      description: |
        Ревизии заявки, новые сверху: отправка, каждая доработка и пересборка маршрута
        (docs/system/domain-model.md, 4.2; archive-export.md, 3.1). В каждой ревизии —
        снимок параметров и отличия от предыдущей; это источник для карточки «что
        изменилось между ревизиями». Доступно менеджеру заявки, координатору и
        руководителю B2B; прочим ролям — `403 ACCESS_DENIED`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница ревизий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestRevisionPage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/requests/{requestId}/route:
    get:
      operationId: getRequestRoute
      tags: [Rework]
      summary: План маршрута заявки
      description: |
        План этапов текущей версии маршрута с правилами, из-за которых этап появился
        (`requiredByRules`), волнами согласований и признаком стройки
        (docs/system/routing-rules.md, 6). В отличие от `stages` в карточке, план
        содержит и этапы, которые ещё не созданы: например, управленческое согласование
        второй волны до завершения первой. Клиенту служебные поля (`queueRole`,
        `requiredByRules`) не отдаются. Доступ — по правам на заявку; чужая заявка — `404`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: План маршрута
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/stages/{stageId}/decision:
    post:
      operationId: decideStage
      tags: [Approvals]
      summary: Решение согласующего по этапу (T08, T09, T11)
      description: |
        Решение по этапу согласования (`LEGAL_APPROVAL`, `FINANCE_APPROVAL`,
        `PROCUREMENT_APPROVAL`, `MGMT_APPROVAL`) активной роли. `APPROVE` закрывает
        этап: когда завершена текущая волна, создаётся управленческое согласование
        второй волны или выполняется T11 (переход в `CONTRACT_SIGNING`). `RETURN`
        требует комментарий: этап переходит в `RETURNED`, заявка — в `REWORK`, когда
        в текущей волне не осталось незавершённых этапов. `REJECT` требует комментарий
        и код причины: T08 переводит заявку в `REJECTED` и отменяет остальные открытые
        этапы (EC-05). Этап не в очереди роли — `403 STAGE_NOT_IN_YOUR_QUEUE`; этап уже
        закрыт — `409 STAGE_ALREADY_DECIDED`. Менеджер заявки не может согласовать
        свою заявку (EC-18) — `403 SELF_APPROVAL_FORBIDDEN`. Актуальный статус заявки
        — `GET /internal/v1/requests/{requestId}`.
      parameters:
        - $ref: '#/components/parameters/StageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageDecisionPayload'
      responses:
        '200':
          description: Решение принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/stages/{stageId}/return:
    post:
      operationId: returnStageToRework
      tags: [Approvals]
      summary: Вернуть заявку на доработку с проверки ТВ (T09b)
      description: |
        Технический специалист возвращает заявку менеджеру, если данные заявки требуют
        исправления (docs/system/status-model.md, T09b). Комментарий обязателен: что
        исправить. Этап `TECH_CHECK` переходит в `RETURNED`, его таймер встаёт на
        автопаузу `REWORK`, заявка переходит в `REWORK`. Возврат с этапа согласования —
        это `POST /internal/v1/stages/{stageId}/decision` с `decision = RETURN`.
      parameters:
        - $ref: '#/components/parameters/StageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageReturnPayload'
      responses:
        '200':
          description: Заявка возвращена на доработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageView'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Общий секрет BFF → ядро из переменной окружения.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT пользователя, выдаётся и проверяется только ядром.
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Ключ идемпотентности (UUID). Повтор с тем же ключом и телом возвращает исходный
        результат; с другим телом — `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: Поле и направление, например `createdAt,desc`.
      schema:
        type: string
        default: createdAt,desc
  responses:
    ValidationError:
      description: Ошибка валидации бизнес-правил
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnauthorizedError:
      description: Нет токена, токен истёк или неверный межсервисный токен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenError:
      description: Роль или принадлежность компании не позволяют действие
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundError:
      description: Объекта нет или он недоступен пользователю
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConflictError:
      description: Конфликт версии, статуса или повторного действия
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Необработанная ошибка ядра
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Ошибка в формате RFC 9457 с машинным кодом.
      required: [type, title, status, code, correlationId, retryable]
      properties:
        type:
          type: string
          example: https://b2b-order-flow/errors/illegal-transition
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          example: ILLEGAL_TRANSITION
        correlationId:
          type: string
        retryable:
          type: boolean
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    Violation:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Warning:
      type: object
      description: 'Не ошибка: заявка принята, но что-то требует внимания.'
      required: [code, message]
      properties:
        code:
          type: string
          example: EXTERNAL_SYSTEM_UNAVAILABLE
        message:
          type: string
    PageInfo:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    RegisterUserRequest:
      type: object
      required: [login, password, fullName, email]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 100
        fullName:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
          example: 28800
        user:
          $ref: '#/components/schemas/UserView'
    UserView:
      type: object
      required: [id, login, fullName, email]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        fullName:
          type: string
        email:
          type: string
        companyRoles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        operatorRoles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanyBrief'
    CompanyBrief:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/CompanyStatus'
    RegisterCompanyRequest:
      type: object
      required: [name, inn, legalAddress]
      properties:
        name:
          type: string
          maxLength: 500
        inn:
          type: string
          description: 10 цифр для организации, 12 — для ИП
        kpp:
          type: string
          maxLength: 9
          pattern: '^\d{9}$'
          description: 9 цифр (docs/system/api-contract.md, 10.4)
        ogrn:
          type: string
          maxLength: 15
          pattern: '^(\d{13}|\d{15})$'
          description: 13 цифр для организации, 15 — для ИП
        legalAddress:
          type: string
          maxLength: 500
    CompanyDecisionRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
          description: Обязательна для отклонения.
        comment:
          type: string
          maxLength: 4000
    CompanyView:
      type: object
      required: [id, name, inn, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        inn:
          type: string
        kpp:
          type: string
        ogrn:
          type: string
        legalAddress:
          type: string
        status:
          $ref: '#/components/schemas/CompanyStatus'
        rejectReason:
          type: string
        confirmedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CompanyPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CompanyView'
        page:
          $ref: '#/components/schemas/PageInfo'
    CreateRequestPayload:
      type: object
      description: |
        Поля черновика. Обязательность бизнес-полей проверяется при отправке (T01),
        а не при создании черновика: клиент заполняет заявку постепенно.
      properties:
        address:
          type: string
          maxLength: 500
        requestedSpeedMbps:
          type: integer
          minimum: 1
          maximum: 100000
        desiredDate:
          type: string
          format: date
        contactName:
          type: string
          maxLength: 255
        contactPhone:
          type: string
          maxLength: 32
        contractPreference:
          $ref: '#/components/schemas/ContractType'
        clientComment:
          type: string
          maxLength: 4000
    UpdateRequestPayload:
      allOf:
        - $ref: '#/components/schemas/CreateRequestPayload'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64
              minimum: 0
    VersionedAction:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
    AssignManagerPayload:
      type: object
      required: [managerId, version]
      properties:
