      operationId: getRequestSla
      tags: [Sla]
      summary: Таймеры SLA и контрольные сроки заявки
      description: |
        Норматив, остаток, время по SLA и календарное, журнал пауз по каждому этапу и по
        контрольным срокам заявки (docs/system/sla.md, 8 и 10). Доступно менеджеру,
