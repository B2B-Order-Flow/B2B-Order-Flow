      type: string
      enum: [OFFER, STANDARD, CLIENT_FORM]
    Role:
      type: string
      enum:
        - CLIENT_OWNER
        - CLIENT_ADMIN
        - CLIENT_REQUESTER
        - SALES_MANAGER
        - TECH_SPECIALIST
        - LAWYER
        - FINANCE_CONTROLLER
        - PROCUREMENT_SPECIALIST
        - B2B_HEAD
        - ENGINEER
        - COORDINATOR
        - ADMIN
    StageType:
      type: string
      description: Типы этапов маршрута (docs/system/status-model.md, 4.1).
      enum:
        - TECH_CHECK
        - RECHECK_TECH
        - LEGAL_APPROVAL
        - FINANCE_APPROVAL
        - PROCUREMENT_APPROVAL
        - MGMT_APPROVAL
        - CONTRACT_SIGNING
        - CONSTRUCTION
        - INSTALLATION
        - ACTIVATION
        - REMEDIATION
        - CLOSING
    StageStatus:
      type: string
      enum: [QUEUED, IN_PROGRESS, DONE, RETURNED, REJECTED, SUPERSEDED, CANCELLED]
    TechResult:
      type: string
      description: Результат проверки технической возможности.
      enum: [AVAILABLE, WITH_CONSTRUCTION, NONE]
    RequestClass:
      type: string
      description: |
        Производный класс заявки (docs/system/routing-rules.md, 8): `STANDARD` — согласований
        нет, `EXTENDED` — только юридическое и/или финансовое, `LARGE` — закупочное или
        управленческое.
      enum: [STANDARD, EXTENDED, LARGE]
    StageView:
      type: object
      required: [id, requestId, type, status, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        requestNumber:
          type: string
          example: REQ-2026-000123
        type:
          $ref: '#/components/schemas/StageType'
        status:
          $ref: '#/components/schemas/StageStatus'
        queueRole:
          $ref: '#/components/schemas/Role'
        assigneeId:
          type: string
          format: uuid
          description: Не отдаётся клиенту
        needsReassignment:
          type: boolean
          description: Исполнитель деактивирован, этап ждёт переназначения
        requiredByRules:
          type: array
          description: ID сработавших правил маршрутизации, из-за которых создан этап
          items:
            type: string
            example: R-01
        routeVersion:
          type: integer
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        takenAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    StagePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/StageView'
        page:
          $ref: '#/components/schemas/PageInfo'
    CommercialTermsPayload:
      type: object
      description: |
        Тело T04 (docs/system/api-contract.md, 6.13 и 10.7). Скидка обязательна при
        `tariffType = INDIVIDUAL`; это проверяет ядро.
      required: [tariffType, contractType, version]
      properties:
        tariffType:
          $ref: '#/components/schemas/TariffType'
        discountPercent:
          type: string
          description: Проценты строкой с двумя знаками, от `"0.00"` до `"100.00"`
          pattern: '^[0-9]{1,3}\.[0-9]{2}$'
          example: '15.00'
        contractType:
          $ref: '#/components/schemas/ContractType'
        speedMbps:
          type: integer
          minimum: 1
          maximum: 100000
          description: Если не передан, берётся `requestedSpeedMbps` заявки
        version:
          type: integer
          format: int64
          minimum: 0
    StageAssignPayload:
      type: object
      required: [assigneeId, version]
      properties:
        assigneeId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
    TechResultPayload:
      type: object
      description: |
        Тело результата ТВ (docs/system/api-contract.md, 6.13 и 10.8). Обязательность полей
        зависит от `result`: `capex` и `constructionDays` — при `WITH_CONSTRUCTION`,
        `reasonCode` — при `NONE`, `comment` — при `reasonCode = OTHER`.
      required: [result, version]
      properties:
        result:
          $ref: '#/components/schemas/TechResult'
        capex:
          type: string
          description: Деньги строкой с двумя знаками, больше нуля
          pattern: '^[0-9]+\.[0-9]{2}$'
          example: '300000.00'
        constructionDays:
          type: integer
          minimum: 1
          description: Календарные дни стройки
        reasonCode:
          type: string
          description: Код из справочника `rejection_reason` для шага ТВ
        comment:
          type: string
          maxLength: 4000
        version:
          type: integer
          format: int64
          minimum: 0
    ContractConcludedPayload:
      type: object
      required: [contractNumber, concludedAt, version]
      properties:
        contractNumber:
          type: string
          maxLength: 100
        concludedAt:
          type: string
          format: date
          description: Дата подписания, не позже сегодняшней
        version:
          type: integer
          format: int64
          minimum: 0
