      type: object
      description: |
        Сигнал в канале событий ядро → шлюз (docs/system/api-contract.md, 4.5).
        Несёт только идентификатор события, адресата и короткий `payload`: данные интерфейс
        забирает по REST. `userId` нужен шлюзу для выбора WebSocket-соединений; в браузер
        шлюз отправляет конверт без `userId`: `id`, `type`, `requestId`, `createdAt`,
        `payload` (docs/system/api-contract.md, 4.4).
      required: [id, type, userId, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор уведомления (`notification.id`)
        type:
          $ref: '#/components/schemas/NotificationEventType'
